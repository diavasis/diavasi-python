[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diavasi-client"
version = "0.1.0"
description = "Thin client for the Diavasi data plane"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["grpcio>=1.70", "protobuf>=5.29"]
authors = [{ name = "diavasis" }]

[project.urls]
Homepage = "https://github.com/diavasis/diavasi-python"
Repository = "https://github.com/diavasis/diavasi-python"

[tool.setuptools.packages.find]
include = ["diavasi_client*"]
